<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>

  <style>
    /* OCULTAR botones y controles de Luna */
    .lunaradio-playbutton,
    .lunaradio-volume,
    .lunaradio-stop,
    .lunaradio-live,
    .lunaradio-download,
    .lunaradio-popup,
    .lunaradio-visualizer,
    .lunaradio-coverblur,
    .lunaradio-footer {
      display: none !important;
    }

    /* Mantener solo logo + nombre + metadatos */
    .lunaradio-radioname {
      font-size: 26px !important;
      font-weight: bold;
      margin-top: 10px;
    }

    .lunaradio-songtitle {
      font-size: 18px !important;
      margin-top: 5px;
    }

    .lunaradio-cover {
      border-radius: 0 !important; /* cuadrada */
      width: 220px !important;
      height: 220px !important;
      margin: 20px auto;
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#000; color:#fff;">

  <div id="lunaradio" 
       style="width:100%; height:100vh; background:#000 url('js/consola.png') bottom / cover no-repeat;">
    Cargando reproductor...
  </div>			

  <!-- Reproductor nativo -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
  $("#lunaradio").lunaradio({
    userinterface: "big", 
    backgroundcolor: "#000000",
    fontcolor: "#ffffff",
    hightlightcolor: "#FF6767", 
    fontname: "Bebas Neue", 
    googlefont: "Bebas+Neue&display=swap", 
    fontratio: "0.4", 
    radioname: "BELLOS RECUERDOS", 
    scroll: "true",
    coverimage: "js/brlogo.png",
    onlycoverimage: "false",
    coverstyle: "square",
    usevisualizer: "false", 
    streamurl: "https://whmsonic.playerfullhd.com:7034",
    streamtype: "shoutcast2", 
    shoutcastpath: "/stream",
    shoutcastid: "1", 
    itunestoken: "1000lIPN", 
    metadatainterval: "5000", 
    volume: "80",
    autoplay: "false"
  });

  // Forzar audio nativo
  const audio = document.getElementById("radioNative");
  audio.volume = 0.8;
  audio.play().catch(() => {
    console.log("Autoplay bloqueado por navegador");
  });
  </script>

</body>
</html>
