<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>

  <!-- jQuery desde CDN -->
  <script src="https://cdn.jsdelivr.net/gh/jquery/jquery@3.2.1/dist/jquery.min.js"></script>
  <!-- lunaradio-sincors editado -->
  <script src="js/lunaradio-sincors.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
    }
    #lunaradio {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .station-name {
      font-size: 2em;
      margin-bottom: 5px;
    }
    .station-slogan {
      font-size: 1em;
      margin-bottom: 15px;
      color: #FF6767;
    }
    .cover {
      width: 200px;
      height: 200px;
      object-fit: cover;
      margin-bottom: 15px;
      border-radius: 6px;
      box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.3);
    }
    .metadata {
      font-size: 1.2em;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Contenedor principal -->
  <div id="lunaradio">
    <div class="station-name">BELLOS RECUERDOS</div>
    <div class="station-slogan">"Te llevamos a tu época"</div>
    <img id="cover" class="cover" src="js/brlogo.png" alt="Logo">
    <div id="metadata" class="metadata">Cargando canción...</div>
  </div>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    // Inicializar Lunaradio para obtener metadatos + portada
    $("#lunaradio").lunaradio({
      radioname: "BELLOS RECUERDOS",
      coverimage: "js/brlogo.png",
      coverstyle: "square",
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      metadatainterval: "5000"
    });

    // Control del audio nativo
    const audio = document.getElementById("radioNative");
    audio.volume = 0.8;
    audio.play().catch(() => {
      console.log("Autoplay bloqueado, se requiere interacción");
    });
  </script>

</body>
</html>
