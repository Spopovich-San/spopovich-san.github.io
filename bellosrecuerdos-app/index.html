<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      overflow: hidden;
    }
    #lunaradio {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      text-align: center;
      padding-top: 40px;
      box-sizing: border-box;
    }
    /* Fondo difuminado */
    #luna-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      z-index: 1;
    }
    /* Contenido principal */
    #luna-content {
      position: relative;
      z-index: 2;
    }
    #luna-title {
      color: #FF6767;
      font-size: 28px;
      margin: 0 0 25px 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8); /* sombreado */
    }
    #luna-cover {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.6);
    }
    #luna-track {
      color: #fff;
      font-size: 20px;
      margin-top: 25px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8); /* sombreado */
    }
  </style>
</head>
<body>
  <div id="lunaradio">
    <div id="luna-bg"></div>
    <div id="luna-content">
      <h1 id="luna-title">BELLOS RECUERDOS</h1>
      <img id="luna-cover" src="js/brlogo.png" alt="cover">
      <h2 id="luna-track">Cargando canción...</h2>
    </div>
  </div>

  <script>
    $("#lunaradio").lunaradio({
      radioname: "BELLOS RECUERDOS",
      coverimage: "js/brlogo.png",
      coverstyle: "square",
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      itunestoken: "1000lIPN",
      metadatainterval: "5000",
      autoplay: "true"
    });
  </script>
</body>
</html>
