<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>
</head>
<body style="margin:0; padding:0; background:#000; color:#fff; text-align:center; font-family:Arial, sans-serif;">

  <!-- Nombre estación -->
  <h1 style="margin:10px 0; font-size:18px;">BELLOS RECUERDOS</h1>
  <h3 style="margin:0 0 10px 0; font-size:12px; font-weight:normal;">"Te llevamos a tu época"</h3>

  <!-- Portada -->
  <img id="cover" src="js/brlogo.png" 
       style="width:260px; height:260px; object-fit:cover; border-radius:10px; margin:10px auto; display:block;">

  <!-- Texto dinámico de metadatos -->
  <div id="luna-track" style="margin-top:10px; font-size:13px;"></div>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <!-- Botón Play/Stop -->
  <button id="playBtn" style="margin-top:20px; padding:15px; border:none; border-radius:50%; background:#FF6767; color:#fff; font-size:18px;">
    ⏸
  </button>

  <script>
    const audio = document.getElementById("radioNative");
    const playBtn = document.getElementById("playBtn");

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.load(); audio.play(); 
        playBtn.textContent = "⏸";
      } else {
        audio.pause();
        playBtn.textContent = "▶️";
      }
    });

    function updateCover(url) {
      document.getElementById("cover").src = url;
      document.body.style.background = `#000 url(${url}) center/cover no-repeat`;
    }
  </script>
</body>
</html>
