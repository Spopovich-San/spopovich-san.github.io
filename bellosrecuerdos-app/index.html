<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>
  <style>
    /* Ocultamos los botones de Luna */
    .lunaradio-playbutton,
    .lunaradio-volume,
    .lunaradio-fav,
    .lunaradio-share,
    .lunaradio-social {
      display: none !important;
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#000; color:#fff;">

  <!-- Contenedor del reproductor Luna -->
  <div id="lunaradio" style="width:100%; height:100vh; background:#000;">Cargando...</div>

  <!-- Audio nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    // Inicializamos Luna SOLO para visual (sin manejar audio)
    $("#lunaradio").lunaradio({
      userinterface: "big", 
      backgroundcolor: "#000000",
      fontcolor: "#ffffff",
      hightlightcolor: "#FF6767", 
      fontname: "Bebas Neue", 
      googlefont: "Bebas+Neue&display=swap", 
      fontratio: "0.4", 
      radioname: "BELLOS RECUERDOS", 
      scroll: "true",
      coverimage: "js/brlogo.png",
      onlycoverimage: "false",
      coverstyle: "square",
      usevisualizer: "real", 
      visualizertype: "0", 
      streamurl: "https://whmsonic.playerfullhd.com:7034", 
      streamtype: "shoutcast2", 
      shoutcastpath: "/stream",
      shoutcastid: "1", 
      itunestoken: "1000lIPN", 
      metadatainterval: "5000", 
      volume: "80",
      autoplay: "false" // <- Luna NO reproduce, solo muestra datos
    });

    // Forzamos el autoplay del audio nativo
    const audio = document.getElementById("radioNative");
    audio.volume = 0.8;
    audio.play().catch(() => console.log("Autoplay bloqueado, requiere interacción"));
  </script>

</body>
</html>
