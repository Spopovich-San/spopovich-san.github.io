<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <!-- jQuery desde tu repo -->
  <script src="jquery-3.2.1.min.js"></script>
  <!-- Script Luna modificado -->
  <script src="lunaradio-sincors.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
    }
    #radioNative {
      display: none;
    }
    #playToggle {
      margin-top: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #FF6767;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
    canvas {
      display: block;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <h1>BELLOS RECUERDOS</h1>
  <img id="cover" src="brlogo.png" width="200" style="border-radius:0;"><br>
  <p id="song">Cargando canción...</p>

  <!-- Botón nativo -->
  <button id="playToggle">Play</button>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative">
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <!-- Visualizador -->
  <canvas id="visualizer" width="500" height="100"></canvas>

  <script>
    const audio = document.getElementById("radioNative");
    const btn = document.getElementById("playToggle");

    // Botón Play/Stop
    btn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = "Stop";
      } else {
        audio.pause();
        audio.currentTime = 0; // para que al reanudar vaya al vivo
        btn.textContent = "Play";
      }
    });

    // Visualizador con Web Audio API
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(audio);
    const analyser = ctx.createAnalyser();
    src.connect(analyser);
    analyser.connect(ctx.destination);
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    const canvas = document.getElementById("visualizer");
    const canvasCtx = canvas.getContext("2d");

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      canvasCtx.fillStyle = "#000";
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = dataArray[i];
        canvasCtx.fillStyle = "#FF6767";
        canvasCtx.fillRect(x, canvas.height - barHeight / 2, barWidth, barHeight / 2);
        x += barWidth + 1;
      }
    }
    draw();

    // Forzar autoplay
    window.addEventListener("load", () => {
      audio.play().catch(() => {
        console.log("Autoplay bloqueado, requiere interacción");
      });
    });
  </script>

</body>
</html>
