<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>

  <!-- jQuery -->
  <script src="https://spopovich-san.github.io/bellosrecuerdos-app/js/jquery-3.2.1.min.js"></script>

  <!-- LunaRadio solo para interfaz -->
  <script src="https://spopovich-san.github.io/bellosrecuerdos-app/js/lunaradio-sincors.js"></script>

  <style>
    body {
      margin:0;
      padding:0;
      background:#000;
      color:#fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #lunaradio {
      width: 100%;
      height: 80vh;
    }
    #controls {
      margin-top: 20px;
    }
    button {
      background: #FF6767;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background: #e55555;
    }
  </style>
</head>
<body>

  <div id="lunaradio">Cargando reproductor...</div>

  <!-- Audio nativo oculto -->
  <audio id="radioNative"></audio>

  <!-- Botón de control -->
  <div id="controls">
    <button id="playBtn">▶️ Reproducir</button>
  </div>

  <script>
  // LunaRadio solo para info visual (sin autoplay ni controles internos)
  $("#lunaradio").lunaradio({
    userinterface: "big", 
    radioname: "BELLOS RECUERDOS", 
    streamurl: "https://whmsonic.playerfullhd.com:7034",
    streamtype: "shoutcast2", 
    shoutcastpath: "/stream",
    shoutcastid: "1", 
    metadatainterval: "5000",
    coverimage: "https://spopovich-san.github.io/bellosrecuerdos-app/img/brlogo.png",
    autoplay: "false",
    volume: "0" // silenciado dentro de Luna
  });

  // Control del audio nativo
  const audio = document.getElementById("radioNative");
  const playBtn = document.getElementById("playBtn");
  const streamUrl = "https://whmsonic.playerfullhd.com:7034/stream";

  let isPlaying = false;

  playBtn.addEventListener("click", () => {
    if (!isPlaying) {
      audio.src = streamUrl; // siempre carga desde el streaming en vivo
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = "⏹️ Detener";
      }).catch(err => {
        console.log("Error al reproducir:", err);
      });
    } else {
      audio.pause();
      audio.src = ""; // liberar buffer para que no guarde caché
      isPlaying = false;
      playBtn.textContent = "▶️ Reproducir";
    }
  });
  </script>

</body>
</html>
