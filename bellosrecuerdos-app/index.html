<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    #background-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.4);
      z-index: -1;
      transition: background-image 1s ease-in-out;
    }

    #player-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #station-title { font-size: 36px; margin-bottom: 5px; }
    #station-subtitle { font-size: 18px; font-style: italic; margin-bottom: 20px; }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
      transition: opacity 0.5s ease-in-out;
    }

    #luna-track { margin-top: 20px; font-size: 20px; }

    #playButton {
      margin-top: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #FF6767;
      color: white;
      font-size: 28px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    #playButton:hover { background: #ff4444; }
  </style>
</head>
<body>

  <div id="background-blur"></div>

  <div id="player-container">
    <div id="station-title">BELLOS RECUERDOS</div>
    <div id="station-subtitle">"Te llevamos a tu época"</div>

    <img id="cover" src="js/brlogo.png" alt="Carátula">
    <div id="luna-track">Cargando canción...</div>

    <button id="playButton">▶</button>
  </div>

  <audio id="radioNative" preload="auto">
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("radioNative");
    const playButton = document.getElementById("playButton");
    const coverImg = document.getElementById("cover");
    const backgroundBlur = document.getElementById("background-blur");
    const trackText = document.getElementById("luna-track");

    let isPlaying = false;

    function updateCover(newSrc) {
      coverImg.style.opacity = 0;
      setTimeout(() => {
        coverImg.src = newSrc;
        coverImg.style.opacity = 1;
        backgroundBlur.style.backgroundImage = `url('${newSrc}')`;
      }, 500);
    }

    playButton.addEventListener("click", () => {
      if (isPlaying) {
        audio.pause();
        audio.currentTime = 0;
        playButton.textContent = "▶";
        isPlaying = false;
      } else {
        audio.play().then(() => {
          playButton.textContent = "■";
          isPlaying = true;
        }).catch(err => console.log("Autoplay bloqueado:", err));
      }
    });

    audio.volume = 0.8;
    audio.play().then(() => { playButton.textContent = "■"; isPlaying = true; })
                 .catch(() => console.log("Autoplay bloqueado"));

    // ======== SSE para actualizar metadatos en tiempo real ========
    const evtSource = new EventSource("https://tuserver.com/song-updates"); // reemplaza con tu endpoint SSE

    evtSource.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data); 
        // data: { title: "Título", artist: "Artista", cover: "url_imagen" }

        let fullTitle = data.artist ? `${data.artist} - ${data.title}` : data.title;
        trackText.textContent = fullTitle;

        if (data.cover && data.cover !== "") {
          updateCover(data.cover);
        }
      } catch(e) {
        console.error("Error parseando datos del servidor:", e);
      }
    };

    evtSource.onerror = function(err) {
      console.error("Error SSE:", err);
    };
  </script>

</body>
</html>
