<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>

  <!-- jQuery -->
  <script src="js/jquery-3.2.1.min.js"></script>
  <!-- Luna modificado (sin controles) -->
  <script src="js/lunaradio-sincors.js"></script>

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000 url('js/consola.png') bottom / cover no-repeat;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
    }
    #lunaradio {
      width: 100%;
      height: calc(100vh - 100px);
    }
    /* Botón nativo Play/Stop */
    #controls {
      margin-top: 15px;
    }
    #playBtn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: #FF6767;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Contenedor del reproductor visual -->
  <div id="lunaradio">Cargando reproductor...</div>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative">
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <!-- Controles nativos -->
  <div id="controls">
    <button id="playBtn">▶</button>
  </div>

  <script>
    // Inicializar Luna solo como visual
    $("#lunaradio").lunaradio({
      userinterface: "big",
      backgroundcolor: "",
      fontcolor: "#ffffff",
      hightlightcolor: "#FF6767",
      fontname: "Bebas Neue",
      googlefont: "Bebas+Neue&display=swap",
      fontratio: "0.4",
      radioname: "BELLOS RECUERDOS",
      scroll: "true",
      coverimage: "js/brlogo.png",
      onlycoverimage: "false",
      coverstyle: "square",
      usevisualizer: "real",
      visualizertype: "0",
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      itunestoken: "1000lIPN",
      metadatainterval: "5000",
      volume: "80",
      autoplay: "false"
    });

    // Control del audio nativo
    const audio = document.getElementById("radioNative");
    const playBtn = document.getElementById("playBtn");
    let isPlaying = false;

    playBtn.addEventListener("click", () => {
      if (!isPlaying) {
        audio.src = "https://whmsonic.playerfullhd.com:7034/stream";
        audio.play().then(() => {
          playBtn.textContent = "⏹"; // Cambia a stop
          isPlaying = true;
        }).catch(err => console.log("Autoplay bloqueado:", err));
      } else {
        audio.pause();
        audio.currentTime = 0; // Reinicia para que vuelva en vivo
        playBtn.textContent = "▶";
        isPlaying = false;
      }
    });
  </script>
</body>
</html>
