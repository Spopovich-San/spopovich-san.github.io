<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/gh/jquery/jquery@3.2.1/dist/jquery.min.js"></script>
  <!-- lunaradio modificado -->
  <script src="js/lunaradio-sincors.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Contenedor del Luna modificado -->
  <div id="lunaradio" style="width:100%; height:100vh;">Cargando reproductor...</div>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    // Inicializar el nuevo Luna
    $("#lunaradio").lunaradio({
      radioname: "BELLOS RECUERDOS",
      coverimage: "js/brlogo.png",   // tu logo inicial
      coverstyle: "square",          // "square" o "circle"
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      streamtype: "shoutcast2",
      shoutcastid: "1",
      metadatainterval: 5000
    });

    // Configurar audio nativo
    const audio = document.getElementById("radioNative");
    audio.volume = 0.8;
    audio.play().catch(() => {
      console.log("El autoplay fue bloqueado, se requiere interacción.");
    });
  </script>

</body>
</html>
