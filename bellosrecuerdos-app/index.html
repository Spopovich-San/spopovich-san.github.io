<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      overflow: hidden;
    }
    #lunaradio {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      text-align: center;
      padding-top: 40px;
      box-sizing: border-box;
    }
    /* Fondo difuminado */
    #luna-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(0.6);
      z-index: 1;
    }
    /* Contenido principal */
    #luna-content {
      position: relative;
      z-index: 2;
    }
    #luna-title {
      color: #FF6767;
      font-size: 28px;
      margin: 0 0 25px 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8); /* sombreado */
    }
    #luna-cover {
      width: 300px;
      height: 300px;
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.6);
      margin-top: 10px;
      border-radius: 10px;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    #luna-cover.show {
      opacity: 1;
      transform: scale(1);
    }
    #luna-track {
      color: #fff;
      font-size: 20px;
      margin-top: 25px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8); /* sombreado */
      margin: 10px 0;
    }
    #radio-title {
      font-size: 28px;
      margin-top: 15px;
      color: #FF6767;
    }
    #radio-sub {
      font-size: 18px;
      margin-bottom: 15px;
      font-style: italic;
    }
    #playBtn {
      background: #FF6767;
      border: none;
      border-radius: 50%;
      width: 90px;
      height: 90px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
    }
    #playBtn svg {
      fill: white;
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <div id="lunaradio">
    <div id="luna-bg"></div>
    <div id="luna-content">
      <h1 id="luna-title">BELLOS RECUERDOS</h1>
      <img id="luna-cover" src="js/brlogo.png" alt="cover">
      <h2 id="luna-track">Cargando canción...</h2>
    </div>
  </div>

  <h1 id="radio-title">BELLOS RECUERDOS</h1>
  <div id="radio-sub">"Te llevamos a tu época"</div>

  <img id="luna-cover" src="js/brlogo.png" alt="cover" class="show">
  <h2 id="luna-track">Cargando canción...</h2>

  <!-- Botón Play / Stop -->
  <button id="playBtn">
    <!-- Ícono Play -->
    <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <!-- Ícono Pause (oculto al inicio) -->
    <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display:none;">
      <path d="M6 19h4V5H6zm8-14v14h4V5h-4z"/>
    </svg>
  </button>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    // Inicializar Luna solo para carátula y metadatos
    $("#lunaradio").lunaradio({
      radioname: "BELLOS RECUERDOS",
      coverimage: "js/brlogo.png",
      coverstyle: "square",
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      streamtype: "shoutcast2",
      shoutcastpath: "/stream",
      shoutcastid: "1",
      itunestoken: "1000lIPN",
      metadatainterval: "5000",
      autoplay: "true"
      coverimage: "js/brlogo.png",
      metadatainterval: 5000
    });

    // Animación al cambiar portada
    function updateCover(newSrc) {
      const cover = document.getElementById("luna-cover");
      cover.classList.remove("show");
      setTimeout(() => {
        cover.src = newSrc;
        cover.onload = () => cover.classList.add("show");
      }, 300);
    }

    // Control del audio nativo
    const audio = document.getElementById("radioNative");
    const playBtn = document.getElementById("playBtn");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");

    function setPlayUI() {
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
    }

    function setPauseUI() {
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.load(); // asegura streaming en vivo
        audio.play();
        setPauseUI();
      } else {
        audio.pause();
        setPlayUI();
      }
    });

    // Intentar autoplay
    audio.play().then(() => {
      setPauseUI();
    }).catch(() => {
      console.log("El navegador bloqueó el autoplay.");
      setPlayUI();
    });

    // Ejemplo: simular actualización de portada desde Luna
    // (En sincors.js deberás llamar updateCover(url) cuando cambie la carátula)
    // updateCover("https://link-a-una-nueva-portada.jpg");
  </script>

</body>
</html>
