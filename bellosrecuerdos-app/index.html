<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bellos Recuerdos Radio</title>
  <script src="js/jquery-3.2.1.min.js"></script>
  <script src="js/lunaradio-sincors.js"></script>
  <style>
    body {
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
    }
    #luna-cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 20px;
    }
    #luna-track {
      font-size: 20px;
      margin: 10px 0;
    }
    #radio-title {
      font-size: 32px;
      margin-top: 15px;
      color: #FF6767;
    }
    #radio-sub {
      font-size: 18px;
      margin-bottom: 20px;
      font-style: italic;
    }
    #playBtn {
      background: #FF6767;
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 id="radio-title">BELLOS RECUERDOS</h1>
  <div id="radio-sub">"Te llevamos a tu época"</div>

  <img id="luna-cover" src="js/brlogo.png" alt="cover">
  <h2 id="luna-track">Cargando canción...</h2>

  <!-- Botón Play / Stop -->
  <button id="playBtn">⏸</button>

  <!-- Reproductor nativo oculto -->
  <audio id="radioNative" autoplay>
    <source src="https://whmsonic.playerfullhd.com:7034/stream" type="audio/mpeg">
  </audio>

  <script>
    // Inicializar Luna solo para carátula y metadatos
    $("#lunaradio").lunaradio({
      radioname: "BELLOS RECUERDOS",
      streamurl: "https://whmsonic.playerfullhd.com:7034",
      shoutcastid: "1",
      itunestoken: "1000lIPN",
      coverimage: "js/brlogo.png",
      metadatainterval: 5000
    });

    // Control del audio nativo
    const audio = document.getElementById("radioNative");
    const playBtn = document.getElementById("playBtn");

    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.load(); // asegura sincronía (no reanuda desde pausa, vuelve al vivo)
        audio.play();
        playBtn.textContent = "⏸";
      } else {
        audio.pause();
        playBtn.textContent = "▶️";
      }
    });

    // Intentar autoplay
    audio.play().catch(() => {
      console.log("El navegador bloqueó el autoplay, el usuario debe presionar Play.");
      playBtn.textContent = "▶️";
    });
  </script>

</body>
</html>
